# Configuração do pipeline de textura do gen-fid.
#
# `paths` NÃO entra em nenhum hash (mudar diretório não é mudar cálculo).
# Todas as outras subárvores entram no config_hash da(s) métrica(s) que as usam:
# sha256(env + common + subárvore). Ver src/texture/store.py::cfg_hash.

paths:
  data_dir: gen-fid
  out_dir: outputs/gen-fid

common:
  tile_size_px: 512
  # Pixel spacing desconhecido para estas ROIs (CBIS-DDSM, possivelmente
  # redimensionadas). Tudo roda em ciclos/pixel; beta NÃO é comparável com a
  # literatura em mm^-1. Se o spacing for confirmado, preencher aqui e o eixo
  # físico passa a ser derivado (freq_cpx / spacing).
  pixel_spacing_mm: null
  physical_units: false
  # Grade de quantização do conjunto real (medida: passo mediano 1/4095 = 12 bits).
  # O sintético (float contínuo) é requantizado nesta grade após o alinhamento
  # afim, para que métricas sensíveis a empates (LBP, gradiente, GLCM) não separem
  # os conjuntos pela estrutura de quantização.
  quant_step: 0.000244200244  # 1/4095
  analysis_dtype: float64
  alignment_method: moment

# Alinhamento de intensidade do sintético para a escala do real.
# syn_al = (syn - b)/a.
alignment:
  # 'moment' casa média e desvio (a = sd(syn)/sd(real)); 'ls' usa mínimos quadrados.
  # LS é atenuante — var(syn_al) = var(real)/corr² — e a inflação depende da
  # correlação do par (medido: Pearson(corr, inflação) = −0,87). Como os batches
  # diferem em correlação média, LS confundiria qualidade de pareamento com
  # excesso de potência. O ganho de LS continua sendo gravado no QC porque é ele
  # que descreve o que o modelo fez à escala (a ≈ 0,38).
  method: moment
  requantize_syn: true

# Conjuntos de controle gerados a partir do real.
controls:
  bicubic_factors: [2, 4]          # reduzir (anti-aliasing) e voltar por bicúbico
  noise_seed: 20260904
  # sigma do real_noise = mediana entre pares de std(highpass(syn_al - real)),
  # com o passa-alta no mesmo corte do passa-baixa abaixo.
  noise_sigma_source: median_highpass_residual
  quadrant_size_px: 256
  lowpass_cutoff_cpx: 0.125        # lambda = 8 px: acima disso a razão espectral > 1.5x
  lowpass_order: 4                 # Butterworth (em frequência), aplicado igual a todos

psd:
  detrend_order: 2
  window: hann_periodic
  fit_bins: [5, 29]                # em bins radiais (ciclos/pixel = bin/N); 512 px
  fit_bins_quadrant: [3, 15]       # 256 px
  # bandas em ciclos/pixel: lambda > 64 | 64-16 | 16-8 | 8-4 | < 4 px
  bands_cpx: [[0.0, 0.015625], [0.015625, 0.0625], [0.0625, 0.125], [0.125, 0.25], [0.25, 0.5]]
  harmonic_periods_px: [4, 8]      # grade do decodificador (4) e blocagem JPEG (8)
  rolloff_band_frac_of_nyquist: [0.6, 0.9]

gradient:
  # limiar fixo global para a fração de pixels com |grad| alto: percentil 90 da
  # magnitude de gradiente sobre o conjunto REAL (derivado uma vez, gravado no sidecar)
  threshold_percentile_real: 90

glcm:
  n_levels: 32
  quantization: global             # limites dos percentis do conjunto REAL alinhado
  clip_percentiles: [1.0, 99.0]
  distances_px: [1, 2, 4, 8]
  angles_deg: [0, 45, 90, 135]
  props: [contrast, dissimilarity, homogeneity, ASM, energy, correlation]

lbp:
  configs: [[8, 1], [16, 2]]       # (P, R)
  method: uniform

lacunarity:
  box_sizes_px: [4, 8, 16, 32, 64]

tophat:
  radius_px: 5
  k_mad: 6.0                       # limiar = mediana + k*MAD do top-hat do real
  min_area_px: 3
  match_radius_px: 3

paired:
  ssim_win: 7

stats:
  n_bootstrap: 1000
  seed: 20260904
  auc_useful: 0.80                 # métrica "sensível" se AUC vs algum controle >= isto
  auc_pass_band: [0.40, 0.60]      # "modelo passa" se AUC vs syn cai aqui
  fdr_alpha: 0.05
  strata: [batch, abnormality, split]
